openapi: 3.0.3
info:
  title: Customer Ordering API
  version: 0.1.0
  contact:
    name: customer-ordering maintainers
    url: https://github.com/IQVO/customer-ordering
  description: >-
    REST contract of the customer-ordering bounded context of the retail
    network, derived from retail-network-docs model/model.yaml
    (contexts[customer-ordering].rest) and adjusted by the final cross-context
    decisions (contracts-delta E7, E9, E11 and Gap Register G7, G10, G12, G25,
    and the storefront extension NG1-NG3: saved addresses, checkout by
    saved address, shopper by e-mail and the order history).
    It turns a shopper's cart into a customer order: checkout promises and
    confirms every shipment group at delivery-promise before the order is
    placed, the order carries the ship-to address (synthetic PII, held only
    here), the tracking view is fed by events, and a customer cancellation is a
    request that order-sourcing decides. One restricted in-organization route,
    GET /orders/{orderId}/ship-to, is called only by shipping-and-tracking to
    print a label and is the only route that returns the address. There is no
    authentication anywhere in the network; "restricted" means the route is
    not exposed through the storefront edge. Errors are RFC 9457 problem
    details (application/problem+json) whose type is /problems/<slug>. The
    shared problem types are not-found (404), illegal-transition (409),
    concurrent-update (409) and validation-failed (422). Optional fields are
    omitted when absent, never null.
servers:
  - url: http://localhost:8080
tags:
  - name: Checkout
    description: Turn a cart into a customer order, promising and confirming every shipment group (PlaceOrder).
  - name: Orders
    description: Read and cancel customer orders (GetOrder, GetTracking, CancelOrder) and list a shopper's order history (ListOrdersByShopper).
  - name: Ship-To
    description: Restricted, in-organization read of the ship-to address for label printing (GetShipTo). Caller is shipping-and-tracking only.
  - name: Shoppers
    description: Register a synthetic shopper (RegisterShopper), read a profile with its saved addresses (GetShopper, FindShopperByEmail) and save an address (AddSavedAddress).
  - name: Operations
    description: Liveness and readiness probes.
paths:
  /checkout:
    post:
      tags: [Checkout]
      operationId: placeOrder
      summary: Place a customer order, promising and confirming every shipment group
      description: >-
        PlaceOrder. For each shipment group the service calls delivery-promise
        MakePromise (POST /promises) with the offer the shopper saw and then
        ConfirmPromise (POST /promises/{promiseId}:confirm) before anything is
        stored. If an offer expired or was consumed, or a confirm fails, it
        re-quotes (QuoteDeliveryOffers, POST /delivery-offers:quote) and answers
        409 offer-not-quotable with the new offers; no order is placed. On
        success the order is PLACED and CustomerOrderPlaced is published through
        the outbox in the same transaction. The order id is derived from the
        Idempotency-Key, so a retry after a timeout reuses the same promises.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order placed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: >-
            An offer expired or was consumed or a promise could not be confirmed
            (offer-not-quotable, the body carries re-quoted offers), promise
            capacity exhausted (promise-capacity-exhausted), book closed
            (book-closed) or a concurrent update (concurrent-update).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CheckoutConflictProblem'
        '422':
          description: >-
            validation-failed (including the shipTo / shipToAddressId choice:
            both, neither, an unknown id or another shopper's address),
            line-without-promise (ErrLineWithoutPromise),
            promise-destination-mismatch (ErrPromiseDestinationMismatch) or
            group-spans-nodes from delivery-promise.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: delivery-promise unreachable or timed out (delivery-promise-unavailable). Retry with the same Idempotency-Key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders:
    get:
      tags: [Orders]
      operationId: listOrdersByShopper
      summary: List a shopper's order history, newest first
      description: >-
        ListOrdersByShopper. Keyset pagination like GET /catalog: the page is
        ordered placedAt descending with the orderId as the ascending
        tiebreak, `limit` defaults to 20 and is at most 100, and `after` is
        the nextCursor of the previous page (opaque; anything else is 422
        validation-failed). An unknown shopper is 404 not-found; a shopper
        without orders is an empty page. The items never carry the ship-to
        address.
      parameters:
        - $ref: '#/components/parameters/ShopperIdQuery'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the shopper's orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrderList'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get a customer order with its status and the promise per group
      description: Returns the order without the ship-to address; the address is only on the restricted ship-to route.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}/tracking:
    get:
      tags: [Orders]
      operationId: getOrderTracking
      summary: Get the order's tracking view per shipment group and package
      description: >-
        Served from the event-fed read model OrderTrackingView (delivery-promise,
        order-sourcing and shipping-and-tracking events) joined with the order's
        groups. A package scanned before its label or shipment event arrived is
        listed once the order is known.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The tracking view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderTracking'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}:cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Request the cancellation of every group that is not yet locked
      description: >-
        CancelOrder is a request (G12, G25). Every group still PROMISED (no
        node locked yet) moves to CANCELLATION_REQUESTED and
        CustomerOrderCancelled is published through the outbox with those
        groupNos; locked, shipped and delivered groups are untouched. order-sourcing
        decides: FulfillmentCancelled makes the group CANCELLED (the order is
        CANCELLED once every group is), FulfillmentCancelRefused returns the
        group to fulfilment (the vendor ships; the shopper path becomes a
        return). Refused with 409 cancel-after-lock (ErrCancelAfterLock) when no
        group is unlocked. Repeating the request, or cancelling a CANCELLED order,
        returns the order unchanged and publishes nothing.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: The order after the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: cancel-after-lock (ErrCancelAfterLock), status-regression (ErrStatusRegression), or concurrent-update.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /orders/{orderId}/ship-to:
    get:
      tags: [Ship-To]
      operationId: getShipTo
      summary: Get the ship-to address of an order (restricted, label printing only)
      description: >-
        In-organization, restricted route for shipping-and-tracking (GetShipTo),
        called when it issues a label. The only route that returns ship-to PII
        (synthetic). Not exposed through the storefront edge.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The ship-to address (synthetic PII).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipTo'
        '404':
          $ref: '#/components/responses/NotFound'
  /shoppers:
    get:
      tags: [Shoppers]
      operationId: findShopperByEmail
      summary: Find a shopper by e-mail
      description: >-
        FindShopperByEmail. The match is trimmed and lower-cased, like the
        uniqueness of the registration (case-insensitive). No shopper with
        that e-mail is 404 not-found; an absent or empty e-mail matches
        nothing and is 404 too.
      parameters:
        - $ref: '#/components/parameters/ShopperEmail'
      responses:
        '200':
          description: The shopper with its saved addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shopper'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Shoppers]
      operationId: registerShopper
      summary: Register a synthetic shopper
      description: >-
        RegisterShopper. The email is unique, compared case-insensitively;
        a duplicate is refused with 409 shopper-exists (ErrShopperExists).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterShopperRequest'
      responses:
        '201':
          description: Shopper registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shopper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: shopper-exists (ErrShopperExists).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /shoppers/{shopperId}:
    get:
      tags: [Shoppers]
      operationId: getShopper
      summary: Get a shopper profile with its saved addresses
      description: >-
        GetShopper. The saved addresses are synthetic PII; they leave the
        service only on the shopper routes (and the restricted ship-to route
        of an order), never an event.
      parameters:
        - $ref: '#/components/parameters/ShopperId'
      responses:
        '200':
          description: The shopper.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shopper'
        '404':
          $ref: '#/components/responses/NotFound'
  /shoppers/{shopperId}/addresses:
    post:
      tags: [Shoppers]
      operationId: addSavedAddress
      summary: Save an address on a shopper
      description: >-
        AddSavedAddress. The addressId derives from the Idempotency-Key, so a
        replay (even after the idempotency record expired) returns the same
        address. A shopper holds at most 20 saved addresses; the twenty-first
        is 422 too-many-addresses (ErrTooManyAddresses). A checkout can then
        name the address by its id (CheckoutRequest.shipToAddressId) and the
        address is copied into the order at placement.
      parameters:
        - $ref: '#/components/parameters/ShopperId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipTo'
      responses:
        '201':
          description: Address saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAddress'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No shopper with this id (not-found).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: >-
            The body breaks a value-object rule (validation-failed), the
            twentieth address is already saved (too-many-addresses), or the
            Idempotency-Key was reused with another request
            (idempotency-key-reused).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /healthz:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Liveness probe
      description: Always 200 while the process runs; it checks no dependency.
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Readiness probe
      description: >-
        200 when the drain gate is open, Postgres answers a ping and Kafka
        answers a metadata request (an empty, non-nil topic list). Otherwise
        503 with the problem type dependency-unavailable.
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A dependency is down or the service is draining (dependency-unavailable).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      description: The customer order id (aggregate root id, CloudEvents subject).
      schema:
        type: string
    ShopperId:
      name: shopperId
      in: path
      required: true
      description: The shopper id (aggregate root id).
      schema:
        type: string
        maxLength: 64
    ShopperIdQuery:
      name: shopperId
      in: query
      required: true
      description: The shopper whose order history is listed.
      schema:
        type: string
        maxLength: 64
    ShopperEmail:
      name: email
      in: query
      required: true
      description: The e-mail to find; the match is trimmed and lower-cased.
      schema:
        type: string
        format: email
        maxLength: 254
    After:
      name: after
      in: query
      required: false
      description: The nextCursor of the previous page (opaque; anything else is 422 validation-failed).
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, default 20, at most 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen key (route, key; 24 hour TTL); a replay with the same body returns the stored response.
      schema:
        type: string
        maxLength: 200
  responses:
    BadRequest:
      description: The request is not valid JSON, has an unknown field or contains a NUL character (malformed-request), or the Idempotency-Key header is missing (idempotency-key-required).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No order with this id (not-found).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: The body is well-formed JSON but breaks a value-object rule (validation-failed), or the Idempotency-Key was reused with another request (idempotency-key-reused).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Problem:
      type: object
      description: RFC 9457 problem details. type is /problems/<slug>.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          example: /problems/cancel-after-lock
        title:
          type: string
          example: Cancellation after lock
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: Every shipment group is locked to a node; cancellation is now a return.
        instance:
          type: string
          format: uri-reference
    CheckoutConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            requotedOffers:
              type: array
              description: Present for offer-not-quotable; the new offers to show before placing (CheckoutPromising). One per feasible tier of each failed group.
              items:
                $ref: '#/components/schemas/RequotedOffer'
    RequotedOffer:
      type: object
      required: [groupNo, offerId, tier, deliverByEarliest, deliverByLatest, expiresAt]
      properties:
        groupNo:
          type: integer
          minimum: 1
        offerId:
          type: string
        tier:
          $ref: '#/components/schemas/Tier'
        deliverByEarliest:
          type: string
          format: date-time
        deliverByLatest:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Tier:
      type: string
      enum: [SAME_DAY, NEXT_DAY, TWO_DAY, STANDARD]
    OrderStatus:
      type: string
      description: >-
        Derived from the group states over the groups that are not CANCELLED
        (ADR 0002 A1, A23). LOST and RETURNED are terminal: every such group is
        LOST or RETURNED (LOST when any is lost) and none was delivered; a mix
        of delivered and lost or returned groups, all closed, is PARTIALLY_DELIVERED.
      enum: [PLACED, IN_FULFILLMENT, PARTIALLY_SHIPPED, SHIPPED, PARTIALLY_DELIVERED, DELIVERED, LOST, RETURNED, CANCELLED]
    GroupStatus:
      type: string
      description: >-
        PROMISED (no node locked), LOCKED (FulfillmentLocked), SHIPPED
        (FulfillmentShipped), DELIVERED (every package delivered),
        CANCELLATION_REQUESTED (CustomerOrderCancelled published, order-sourcing
        has not answered), CANCELLED (FulfillmentCancelled or an unkeepable promise),
        LOST (PackageLost for a package of the group) and RETURNED (PackageReturned),
        both terminal.
      enum: [PROMISED, LOCKED, SHIPPED, DELIVERED, LOST, RETURNED, CANCELLATION_REQUESTED, CANCELLED]
    ShipTo:
      type: object
      description: Synthetic PII. Returned only by GET /orders/{orderId}/ship-to; accepted on checkout and shopper registration.
      required: [name, line1, city, region, postalCode, countryCode]
      properties:
        name:
          type: string
          maxLength: 100
        line1:
          type: string
          maxLength: 100
        line2:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        region:
          type: string
          maxLength: 100
        postalCode:
          type: string
          maxLength: 20
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2, upper case.
        phone:
          type: string
          maxLength: 40
    OrderLine:
      type: object
      required: [lineNo, catalogItemId, quantity]
      properties:
        lineNo:
          type: integer
          minimum: 1
          maximum: 2147483647
        catalogItemId:
          type: string
          maxLength: 64
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
    CheckoutGroup:
      type: object
      description: One shipment group and the delivery offer the shopper saw for it.
      required: [groupNo, offerId, lineNos]
      properties:
        groupNo:
          type: integer
          minimum: 1
          maximum: 2147483647
        offerId:
          type: string
          maxLength: 64
        lineNos:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1
    CheckoutRequest:
      type: object
      description: >-
        The cart to place. Exactly one of shipTo and shipToAddressId is
        required: an inline address, or the addressId of an address saved on
        the shopper (AddSavedAddress), which is copied into the order at
        placement. Giving both, neither, an unknown id or the id of another
        shopper's address is 422 validation-failed.
      required: [shopperId, lines, groups]
      properties:
        shopperId:
          type: string
        shipTo:
          $ref: '#/components/schemas/ShipTo'
        shipToAddressId:
          type: string
          maxLength: 64
          description: A saved address of this shopper; the address is copied into the order.
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLine'
        groups:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CheckoutGroup'
    GroupPromise:
      type: object
      required: [groupNo, promiseId, tier, shipBy, deliverByEarliest, deliverByLatest, lineNos, status]
      properties:
        groupNo:
          type: integer
        promiseId:
          type: string
        tier:
          $ref: '#/components/schemas/Tier'
        shipBy:
          type: string
          format: date-time
        deliverByEarliest:
          type: string
          format: date-time
        deliverByLatest:
          type: string
          format: date-time
        lineNos:
          type: array
          items:
            type: integer
        status:
          $ref: '#/components/schemas/GroupStatus'
        revisionNo:
          type: integer
          description: Latest applied PromiseRevised revision; absent until the first revision.
        cancelReason:
          type: string
          description: The free-text reason of the cancellation request, or the reason a policy cancelled the group.
        cancelRequestedAt:
          type: string
          format: date-time
        cancelRefusedReason:
          type: string
          description: order-sourcing refused the cancellation (FulfillmentCancelRefused); the vendor ships and the shopper path is a return.
    CustomerOrder:
      type: object
      description: The customer order without the ship-to address.
      required: [orderId, shopperId, status, destinationPostalPrefix, placedAt, lines, groups]
      properties:
        orderId:
          type: string
        shopperId:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        destinationPostalPrefix:
          type: string
        placedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          description: Present once the order is CANCELLED.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupPromise'
    CancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 200
          description: Free text; the model defines no code list.
    TrackingPackage:
      type: object
      required: [trackingNumber]
      properties:
        trackingNumber:
          type: string
        carrier:
          type: string
        state:
          type: string
          description: The package journey state from PackageScanned (LABELLED .. DELIVERED, RETURNED, LOST) or VOIDED after LabelVoided.
        lastScanNodeId:
          type: string
        lastScanAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        exceptionReason:
          type: string
          description: From PackageExceptionRaised.
    TrackingGroup:
      type: object
      required: [groupNo, promiseId, status, deliverByEarliest, deliverByLatest, packages]
      properties:
        groupNo:
          type: integer
        promiseId:
          type: string
        status:
          $ref: '#/components/schemas/GroupStatus'
        deliverByEarliest:
          type: string
          format: date-time
        deliverByLatest:
          type: string
          format: date-time
        atRiskReason:
          type: string
          description: From PromiseAtRisk.
        unsourceableReason:
          type: string
          description: From FulfillmentUnsourceable.
        promiseVerdict:
          type: string
          enum: [KEPT, BROKEN]
          description: From PromiseKept or PromiseBroken.
        lateByMinutes:
          type: integer
        lockedAt:
          type: string
          format: date-time
        shippedAt:
          type: string
          format: date-time
        cancelRefusedReason:
          type: string
        lostAt:
          type: string
          format: date-time
          description: When a package of the group was declared lost (PackageLost); set when the group is LOST.
        returnedAt:
          type: string
          format: date-time
          description: When a package of the group was returned to the sender (PackageReturned); set when the group is RETURNED.
        outcomePackage:
          type: string
          description: The tracking number named by PackageLost or PackageReturned; set when the group is LOST or RETURNED.
        packages:
          type: array
          items:
            $ref: '#/components/schemas/TrackingPackage'
    OrderTracking:
      type: object
      required: [orderId, status, groups]
      properties:
        orderId:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/TrackingGroup'
    RegisterShopperRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        savedAddresses:
          type: array
          maxItems: 20
          description: Addresses saved with the registration; the service mints their ids.
          items:
            $ref: '#/components/schemas/ShipTo'
    SavedAddress:
      type: object
      description: >-
        A saved address: the ShipTo the shopper sent plus the addressId the
        service minted (derived from the add's Idempotency-Key). Synthetic
        PII, returned only on the shopper routes.
      required: [addressId, name, line1, city, region, postalCode, countryCode]
      properties:
        addressId:
          type: string
        name:
          type: string
          maxLength: 100
        line1:
          type: string
          maxLength: 100
        line2:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        region:
          type: string
          maxLength: 100
        postalCode:
          type: string
          maxLength: 20
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        phone:
          type: string
          maxLength: 40
    Shopper:
      type: object
      required: [shopperId, email, status, registeredAt, savedAddresses]
      properties:
        shopperId:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [ACTIVE]
        registeredAt:
          type: string
          format: date-time
        savedAddresses:
          type: array
          maxItems: 20
          description: The shopper's saved addresses, oldest first; possibly empty.
          items:
            $ref: '#/components/schemas/SavedAddress'
    CustomerOrderList:
      type: object
      description: One page of a shopper's order history, newest first; the items never carry the address.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerOrder'
        nextCursor:
          type: string
          description: Present when a next page exists; pass it as after.
