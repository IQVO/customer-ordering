          subject: 7a1e6c52
          time: '2026-10-23T10:15:30Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:order-sourcing:events:FulfillmentLocked:v1
          data:
            assignmentId: a-77
            orderId: 7a1e6c52
            groupNo: 1
            nodeId: fc-aus-1
            pickupDepartureId: dep-9
            lockedAt: '2026-10-23T10:30:00Z'
            lockReason: CUTOFF
