    ConsumedFulfillmentShipped:
      name: FulfillmentShipped
      title: FulfillmentShipped (consumed)
      summary: A shipment group was shipped (MarkGroupShipped).
      description: '`type` = `com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentShipped` produced by order-sourcing on `retailnetwork.order-sourcing.events`. A shipment group was shipped (MarkGroupShipped). Dispatch on the full type; unknown fields are ignored.'
      contentType: application/cloudevents+json
      tags:
      - name: consumed
      payload:
        $ref: '#/components/schemas/FulfillmentShippedEvent'
      examples:
      - name: fulfillmentShipped
        summary: A shipment group was shipped (MarkGroupShipped).
        payload:
          specversion: '1.0'
          id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c40
