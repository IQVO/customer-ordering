      examples:
      - name: promiseKept
        summary: A promise was kept.
        payload:
          specversion: '1.0'
          id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c40
          source: /retailnetwork/delivery-promise
          type: com.retailnetwork.commerce.delivery-promise.promise.PromiseKept
          subject: 7a1e6c52
          time: '2026-10-23T10:15:30Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:delivery-promise:events:PromiseKept:v1
          data:
            promiseId: p-1001
            orderId: 7a1e6c52
            nodeId: fc-aus-1
            deliveredAt: '2026-10-24T15:00:00Z'
            deliverByLatest: '2026-10-24T22:00:00Z'
    ConsumedPromiseBroken:
      name: PromiseBroken
      title: PromiseBroken (consumed)
      summary: A promise was broken.
      description: '`type` = `com.retailnetwork.commerce.delivery-promise.promise.PromiseBroken` produced by delivery-promise on `retailnetwork.delivery-promise.events`. A promise was broken. Dispatch on the full type; unknown fields are ignored.'
      contentType: application/cloudevents+json
      tags:
      - name: consumed
      payload:
        $ref: '#/components/schemas/PromiseBrokenEvent'
      examples:
      - name: promiseBroken
        summary: A promise was broken.
        payload:
          specversion: '1.0'
          id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c40
          source: /retailnetwork/delivery-promise
          type: com.retailnetwork.commerce.delivery-promise.promise.PromiseBroken
          subject: 7a1e6c52
          time: '2026-10-23T10:15:30Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:delivery-promise:events:PromiseBroken:v1
          data:
            promiseId: p-1001
            orderId: 7a1e6c52
            nodeId: fc-aus-1
            deliveredAt: '2026-10-25T09:00:00Z'
            deliverByLatest: '2026-10-24T22:00:00Z'
            lateByMinutes: 660
            cause: LATE
    ConsumedPromiseUnkeepable:
      name: PromiseUnkeepable
      title: PromiseUnkeepable (consumed)
      summary: 'Re-promising found no path (E9, G10): the policy CancelOnUnfulfillable cancels the group.'
      description: '`type` = `com.retailnetwork.commerce.delivery-promise.promise.PromiseUnkeepable` produced by delivery-promise on `retailnetwork.delivery-promise.events`. Re-promising found no path (E9, G10): the policy CancelOnUnfulfillable cancels the group. Dispatch on the full type; unknown fields are ignored.'
      contentType: application/cloudevents+json
      tags:
      - name: consumed
      payload:
        $ref: '#/components/schemas/PromiseUnkeepableEvent'
      examples:
      - name: promiseUnkeepable
        summary: 'Re-promising found no path (E9, G10): the policy CancelOnUnfulfillable cancels the group.'
        payload:
          specversion: '1.0'
          id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c40
          source: /retailnetwork/delivery-promise
          type: com.retailnetwork.commerce.delivery-promise.promise.PromiseUnkeepable
          subject: 7a1e6c52
          time: '2026-10-23T10:15:30Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:delivery-promise:events:PromiseUnkeepable:v1
          data:
            promiseId: p-1001
            orderId: 7a1e6c52
            groupNo: 1
            reason: NO_FEASIBLE_PATH
    ConsumedFulfillmentLocked:
      name: FulfillmentLocked
      title: FulfillmentLocked (consumed)
      summary: A shipment group was locked to a node (MarkInFulfillment).
      description: '`type` = `com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentLocked` produced by order-sourcing on `retailnetwork.order-sourcing.events`. A shipment group was locked to a node (MarkInFulfillment). Dispatch on the full type; unknown fields are ignored.'
      contentType: application/cloudevents+json
      tags:
      - name: consumed
      payload:
        $ref: '#/components/schemas/FulfillmentLockedEvent'
      examples:
