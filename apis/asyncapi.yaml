      description: '`type` = `com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentCancelled` produced by order-sourcing on `retailnetwork.order-sourcing.events`. order-sourcing accepted the cancellation request of a group (E11). Dispatch on the full type; unknown fields are ignored.'
      contentType: application/cloudevents+json
