asyncapi: 3.0.0
info:
  title: customer-ordering Domain Events
  version: 1.0.0
  contact:
    name: customer-ordering maintainers
    url: https://github.com/IQVO/customer-ordering
    email: customer-ordering@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
  - name: customer-ordering
    description: The customer-ordering bounded context (retail network, commerce tier).
  - name: customerorder
    description: Events raised by the CustomerOrder aggregate.
  - name: consumed
    description: Events produced by sibling contexts that this service consumes (ADR 0003).
  description: |-
    Event catalog for the **customer-ordering** bounded context of the retail network (commerce tier): it turns a shopper's cart into a customer order, promising and confirming every shipment group at checkout (ADR 0001, ADR 0002).

    **Published.** Two integration events, `CustomerOrderPlaced` and `CustomerOrderCancelled`, on `retailnetwork.customer-ordering.events` through a **transactional outbox** (the order row and its already-encoded events are written in ONE database transaction; an always-on relay drains them to Kafka, at-least-once, the CloudEvents `id` is stored with the outbox row). Both types are catalogued in ADR 0004. Nothing is published on `retailnetwork.customer-ordering.analytics`: the model names no analytics-only event for this context. No event carries the ship-to address (PII); `CustomerOrderPlaced` carries the destination postal prefix only.

    **Consumed.** Fifteen events from delivery-promise, order-sourcing and shipping-and-tracking (see the `receive` operations and ADR 0003). The messages list only the fields this service relies on; the producers' own AsyncAPI files are authoritative and unknown fields are ignored. Each consumer group name comes from a mandatory environment variable.

    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka header `content-type: application/cloudevents+json; charset=UTF-8`. `specversion`, `id`, `source` (`/retailnetwork/customer-ordering`), `type`, `subject` (the orderId), `time`, `datacontenttype` (`application/json`) and `dataschema` (`urn:retailnetwork:customer-ordering:events:<EventName>:v1`) are all required. Kafka key = the subject. Type = `com.retailnetwork.commerce.customer-ordering.customerorder.<EventName>`. A breaking payload change is a new `.v2` type, never a mutation. Dispatch on the full `type`, ignore unknown types, dedupe on `id`.

    **Conventions.** `data` is camelCase; instants are RFC 3339 UTC; enums are UPPER_SNAKE; optional fields are omitted when absent (never null); arrays are always present.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: Retail-network Kafka broker (host supplied by the deployment environment via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  customerOrderingEvents:
    address: retailnetwork.customer-ordering.events
    title: customer-ordering integration topic
    description: This service's integration topic. Written by the outbox relay; key = subject (the orderId). Every message carries the CloudEvents content-type header.
    messages:
      CustomerOrderPlaced:
        $ref: '#/components/messages/CustomerOrderPlaced'
      CustomerOrderCancelled:
        $ref: '#/components/messages/CustomerOrderCancelled'
  deliveryPromiseEvents:
    address: retailnetwork.delivery-promise.events
    title: delivery-promise integration topic (consumed)
    description: Produced by delivery-promise; consumed by customer-ordering with its own consumer group (see ADR 0003). Idempotent on the CloudEvents id (inbox), dispatch on the full type, tolerant decoding, dead-letter on poison messages.
    messages:
      PromiseAtRisk:
        $ref: '#/components/messages/ConsumedPromiseAtRisk'
      PromiseRevised:
        $ref: '#/components/messages/ConsumedPromiseRevised'
      PromiseKept:
        $ref: '#/components/messages/ConsumedPromiseKept'
      PromiseBroken:
        $ref: '#/components/messages/ConsumedPromiseBroken'
      PromiseUnkeepable:
        $ref: '#/components/messages/ConsumedPromiseUnkeepable'
  orderSourcingEvents:
    address: retailnetwork.order-sourcing.events
    title: order-sourcing integration topic (consumed)
    description: Produced by order-sourcing; consumed by customer-ordering with its own consumer group (see ADR 0003). Idempotent on the CloudEvents id (inbox), dispatch on the full type, tolerant decoding, dead-letter on poison messages.
    messages:
      FulfillmentLocked:
        $ref: '#/components/messages/ConsumedFulfillmentLocked'
      FulfillmentShipped:
        $ref: '#/components/messages/ConsumedFulfillmentShipped'
      FulfillmentUnsourceable:
        $ref: '#/components/messages/ConsumedFulfillmentUnsourceable'
      FulfillmentCancelled:
        $ref: '#/components/messages/ConsumedFulfillmentCancelled'
      FulfillmentCancelRefused:
        $ref: '#/components/messages/ConsumedFulfillmentCancelRefused'
  shippingAndTrackingEvents:
    address: retailnetwork.shipping-and-tracking.events
    title: shipping-and-tracking integration topic (consumed)
    description: Produced by shipping-and-tracking; consumed by customer-ordering with its own consumer group (see ADR 0003). Idempotent on the CloudEvents id (inbox), dispatch on the full type, tolerant decoding, dead-letter on poison messages.
    messages:
      LabelIssued:
        $ref: '#/components/messages/ConsumedLabelIssued'
      LabelVoided:
        $ref: '#/components/messages/ConsumedLabelVoided'
      PackageScanned:
        $ref: '#/components/messages/ConsumedPackageScanned'
      PackageDelivered:
        $ref: '#/components/messages/ConsumedPackageDelivered'
      PackageExceptionRaised:
        $ref: '#/components/messages/ConsumedPackageExceptionRaised'
operations:
  publishCustomerOrderingEvents:
    action: send
    title: Publish customer-ordering events
    summary: Publish CustomerOrderPlaced and CustomerOrderCancelled through the transactional outbox.
    description: The service sends the two events of the CustomerOrder aggregate to `retailnetwork.customer-ordering.events`. Consumers route on the full `type`.
    tags:
    - name: customer-ordering
    channel:
      $ref: '#/channels/customerOrderingEvents'
    messages:
    - $ref: '#/channels/customerOrderingEvents/messages/CustomerOrderPlaced'
    - $ref: '#/channels/customerOrderingEvents/messages/CustomerOrderCancelled'
  receiveDeliveryPromiseEvents:
    action: receive
    title: Receive delivery-promise events
    summary: Consume PromiseAtRisk, PromiseRevised, PromiseKept, PromiseBroken, PromiseUnkeepable from delivery-promise.
    description: customer-ordering consumes PromiseAtRisk, PromiseRevised, PromiseKept, PromiseBroken, PromiseUnkeepable from `retailnetwork.delivery-promise.events`. See ADR 0003 for what each event does to the order and the OrderTrackingView read model.
    tags:
    - name: consumed
    channel:
      $ref: '#/channels/deliveryPromiseEvents'
    messages:
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseAtRisk'
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseRevised'
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseKept'
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseBroken'
    - $ref: '#/channels/deliveryPromiseEvents/messages/PromiseUnkeepable'
  receiveOrderSourcingEvents:
    action: receive
    title: Receive order-sourcing events
    summary: Consume FulfillmentLocked, FulfillmentShipped, FulfillmentUnsourceable, FulfillmentCancelled, FulfillmentCancelRefused from order-sourcing.
    description: customer-ordering consumes FulfillmentLocked, FulfillmentShipped, FulfillmentUnsourceable, FulfillmentCancelled, FulfillmentCancelRefused from `retailnetwork.order-sourcing.events`. See ADR 0003 for what each event does to the order and the OrderTrackingView read model.
    tags:
    - name: consumed
    channel:
      $ref: '#/channels/orderSourcingEvents'
    messages:
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentLocked'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentShipped'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentUnsourceable'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentCancelled'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentCancelRefused'
  receiveShippingAndTrackingEvents:
    action: receive
    title: Receive shipping-and-tracking events
    summary: Consume LabelIssued, LabelVoided, PackageScanned, PackageDelivered, PackageExceptionRaised from shipping-and-tracking.
    description: customer-ordering consumes LabelIssued, LabelVoided, PackageScanned, PackageDelivered, PackageExceptionRaised from `retailnetwork.shipping-and-tracking.events`. See ADR 0003 for what each event does to the order and the OrderTrackingView read model.
    tags:
    - name: consumed
    channel:
      $ref: '#/channels/shippingAndTrackingEvents'
    messages:
    - $ref: '#/channels/shippingAndTrackingEvents/messages/LabelIssued'
    - $ref: '#/channels/shippingAndTrackingEvents/messages/LabelVoided'
    - $ref: '#/channels/shippingAndTrackingEvents/messages/PackageScanned'
    - $ref: '#/channels/shippingAndTrackingEvents/messages/PackageDelivered'
    - $ref: '#/channels/shippingAndTrackingEvents/messages/PackageExceptionRaised'
components:
  messages:
    CustomerOrderPlaced:
      name: CustomerOrderPlaced
      title: CustomerOrderPlaced
      summary: A customer order was placed (every group promised and confirmed).
      description: '`type` = `com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderPlaced`; subject and key = the orderId. Raised by PlaceOrder when the order is saved in state PLACED, in the same transaction as the outbox row. Consumed by order-sourcing (creates one assignment per group) and delivery-promise (a repeated confirm is a no-op, ADR 0003). Carries the destination postal prefix only: the ship-to address never leaves customer-ordering except through GET /orders/{orderId}/ship-to.'
      contentType: application/cloudevents+json
      tags:
      - name: customerorder
      payload:
        $ref: '#/components/schemas/CustomerOrderPlacedEvent'
      examples:
      - name: customerOrderPlaced
        summary: A customer order was placed (every group promised and confirmed).
        payload:
          specversion: '1.0'
          id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c40
          source: /retailnetwork/customer-ordering
          type: com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderPlaced
          subject: 7a1e6c52-0d2b-4f0e-9d6a-5c6f1b8e2a10
          time: '2026-10-23T10:15:30Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:customer-ordering:events:CustomerOrderPlaced:v1
          data:
            orderId: 7a1e6c52-0d2b-4f0e-9d6a-5c6f1b8e2a10
            shopperId: 3b0c1f0e-6f0a-4a39-8a55-2b7f0d8c9e11
            destinationPostalPrefix: '787'
            placedAt: '2026-10-23T10:15:30Z'
            groups:
            - groupNo: 1
              promiseId: p-1001
              tier: NEXT_DAY
              witnessNodeId: fc-aus-1
              shipBy: '2026-10-23T22:00:00Z'
              deliverByEarliest: '2026-10-24T13:00:00Z'
              deliverByLatest: '2026-10-24T22:00:00Z'
              lines:
              - lineNo: 1
                catalogItemId: sku-100
                quantity: 2
    CustomerOrderCancelled:
      name: CustomerOrderCancelled
      title: CustomerOrderCancelled
      summary: The cancellation of one or more groups of a customer order was requested.
      description: '`type` = `com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderCancelled`; subject and key = the orderId. Raised by CancelOrder (shopper) and by the CancelOnUnfulfillable policy (PromiseUnkeepable). It is a REQUEST (G12): order-sourcing decides and answers FulfillmentCancelled or FulfillmentCancelRefused, delivery-promise cancels the promises of the groupNos.'
      contentType: application/cloudevents+json
      tags:
      - name: customerorder
      payload:
        $ref: '#/components/schemas/CustomerOrderCancelledEvent'
      examples:
      - name: customerOrderCancelled
        summary: The cancellation of one or more groups of a customer order was requested.
        payload:
          specversion: '1.0'
          id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c40
          source: /retailnetwork/customer-ordering
          type: com.retailnetwork.commerce.customer-ordering.customerorder.CustomerOrderCancelled
          subject: 7a1e6c52-0d2b-4f0e-9d6a-5c6f1b8e2a10
          time: '2026-10-23T10:15:30Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:customer-ordering:events:CustomerOrderCancelled:v1
          data:
            orderId: 7a1e6c52-0d2b-4f0e-9d6a-5c6f1b8e2a10
            reason: changed my mind
            cancelledAt: '2026-10-23T10:20:00Z'
            groupNos:
            - 1
    ConsumedPromiseAtRisk:
      name: PromiseAtRisk
      title: PromiseAtRisk (consumed)
      summary: A promise is at risk.
      description: '`type` = `com.retailnetwork.commerce.delivery-promise.promise.PromiseAtRisk` produced by delivery-promise on `retailnetwork.delivery-promise.events`. A promise is at risk. Dispatch on the full type; unknown fields are ignored.'
      contentType: application/cloudevents+json
      tags:
      - name: consumed
      payload:
        $ref: '#/components/schemas/PromiseAtRiskEvent'
      examples:
      - name: promiseAtRisk
        summary: A promise is at risk.
        payload:
          specversion: '1.0'
          id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c40
          source: /retailnetwork/delivery-promise
          type: com.retailnetwork.commerce.delivery-promise.promise.PromiseAtRisk
          subject: 7a1e6c52
          time: '2026-10-23T10:15:30Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:delivery-promise:events:PromiseAtRisk:v1
          data:
            promiseId: p-1001
            orderId: 7a1e6c52
            reason: NODE_DELAYED
            detectedAt: '2026-10-23T12:00:00Z'
    ConsumedPromiseRevised:
      name: PromiseRevised
      title: PromiseRevised (consumed)
      summary: A promise was revised to a later window (UpdateGroupPromise).
      description: '`type` = `com.retailnetwork.commerce.delivery-promise.promise.PromiseRevised` produced by delivery-promise on `retailnetwork.delivery-promise.events`. A promise was revised to a later window (UpdateGroupPromise). Dispatch on the full type; unknown fields are ignored.'
      contentType: application/cloudevents+json
      tags:
      - name: consumed
      payload:
        $ref: '#/components/schemas/PromiseRevisedEvent'
      examples:
      - name: promiseRevised
        summary: A promise was revised to a later window (UpdateGroupPromise).
        payload:
          specversion: '1.0'
          id: 3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c40
          source: /retailnetwork/delivery-promise
          type: com.retailnetwork.commerce.delivery-promise.promise.PromiseRevised
          subject: 7a1e6c52
          time: '2026-10-23T10:15:30Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:delivery-promise:events:PromiseRevised:v1
          data:
            promiseId: p-1001
            orderId: 7a1e6c52
            revisionNo: 1
            deliverByEarliest: '2026-10-25T13:00:00Z'
            deliverByLatest: '2026-10-25T22:00:00Z'
            shipBy: '2026-10-24T22:00:00Z'
            nodeId: fc-aus-2
            reason: NODE_EXCLUDED
    ConsumedPromiseKept:
      name: PromiseKept
      title: PromiseKept (consumed)
      summary: A promise was kept.
      description: '`type` = `com.retailnetwork.commerce.delivery-promise.promise.PromiseKept` produced by delivery-promise on `retailnetwork.delivery-promise.events`. A promise was kept. Dispatch on the full type; unknown fields are ignored.'
      contentType: application/cloudevents+json
      tags:
      - name: consumed
      payload:
