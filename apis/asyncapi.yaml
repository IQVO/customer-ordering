      description: '`type` = `com.retailnetwork.commerce.order-sourcing.assignment.FulfillmentUnsourceable` produced by order-sourcing on `retailnetwork.order-sourcing.events`. No node can fulfil the group; shown in tracking until a revised promise or PromiseUnkeepable arrives. Dispatch on the full type; unknown fields are ignored.'
      contentType: application/cloudevents+json
